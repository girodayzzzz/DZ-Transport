name: Verify and deploy GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DZ_SITE_MODE: preview
      ASTRO_TELEMETRY_DISABLED: '1'
      SITE_URL: ${{ vars.WEBSITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.WEBSITE_BASE_PATH || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Measure mobile Lighthouse results
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/dz-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          url="http://127.0.0.1:4321${BASE_PATH%/}/"
          for attempt in {1..30}; do
            if curl --fail --silent "$url" -o /dev/null; then break; fi
            sleep 1
          done
          export CHROME_PATH="$(command -v google-chrome)"
          npx --yes lighthouse@13.6.0 "$url" --chrome-flags="--headless --no-sandbox" --output=json --output-path=/tmp/dz-lighthouse.json --quiet
          node --input-type=module -e '
            import fs from "node:fs";
            const {categories} = JSON.parse(fs.readFileSync("/tmp/dz-lighthouse.json", "utf8"));
            const report = Object.values(categories).map(category => "- " + category.title + " " + Math.round(100 * category.score)).join("\n");
            console.log(report);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "## Mobile Lighthouse (local Pages build)\n\n" + report + "\n");
          '
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: /tmp/dz-lighthouse.json
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
